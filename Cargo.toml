[package]
name = "frawk"
version = "0.4.8"
authors = ["Eli Rosenthal <ezr@cs.brown.edu>"]
edition = "2018"
description = "an efficient Awk-like language"
homepage = "https://github.com/ezrosent/frawk"
repository = "https://github.com/ezrosent/frawk"
readme = "README.md"
keywords = ["awk", "csv", "tsv"]
categories = ["command-line-utilities", "text-processing"]
license = "MIT OR  Apache-2.0"
build = "build.rs"

[features]
default = ["use_jemalloc", "allow_avx2", "llvm_backend", "unstable"]
use_jemalloc = ["tikv-jemallocator"]
use_mimalloc = ["mimalloc"]
# Certain features leverage the AVX2 instruction set, but AVX2 can often make
# the entire application slightly slower, even on chips that support it. For
# those cases, consider disabling allow_avx2.
allow_avx2 = []
llvm_backend = ["llvm-sys"]
unstable = []

[dependencies]
assert_cmd = "2.2.2"
bumpalo = { version = "3.20.3", features = ["collections"] }
cfg-if = "1.0"
clap = "4.6.1"
cranelift = "0.132.1"
cranelift-codegen = "0.132.1"
cranelift-frontend = "0.132.1"
cranelift-jit = "0.132.1"
cranelift-module = "0.132.1"
cranelift-native = "0.132.1"
crossbeam = "0.8.4"
crossbeam-channel = "0.5"
fast-float2 = "0.2.3"
grep-cli = "0.1"
hashbrown = "0.17"
itertools = "0.14"
itoa = "1.0"
lalrpop-util = "0.23.1"
lazy_static = "1.5.0"
libc = "0.2"
llvm-sys = { version = "160", optional = true }
memchr = "2.8.1"
mimalloc = { version = "0.1.52", optional = true }
num_cpus = "1.17.0"
paste = "1.0"
petgraph = "0.8"
rand = "0.10.1"
regex = "1.12.4"
regex-syntax = "0.8.11"
ryu = "1.0"
smallvec = "1.15"
target-lexicon = "0.13.5"
termcolor = "1.4"
tikv-jemallocator = { version = "0.7", optional = true }
unicode-xid = "0.2.6"

[build-dependencies]
lalrpop = "0.23.1"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27"

[profile.dev]
# Turn on a small amount of optimisation in Development mode.
opt-level = 1
debug-assertions = true

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 1
debug-assertions = true

[profile.release]
lto = "thin"
